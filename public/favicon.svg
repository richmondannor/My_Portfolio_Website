<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Neon Halo -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.45" filter="url(#outerGlow)" />

  <!-- Main Card Body -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Cyber Grid -->
  <path d="M12 46 H116 M12 82 H116 M46 12 V116 M82 12 V116" stroke="#00f2fe" stroke-opacity="0.06" stroke-width="1" />

  <!-- Terminal Header Dots -->
  <circle cx="28" cy="27" r="3" fill="#f43f5e" opacity="0.85" />
  <circle cx="37" cy="27" r="3" fill="#fbbf24" opacity="0.85" />
  <circle cx="46" cy="27" r="3" fill="#34d399" opacity="0.85" />

  <!-- Terminal Prompt > -->
  <path d="M36 50 L58 68 L36 86" fill="none" stroke="url(#chevronGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Terminal Cursor _ -->
  <rect x="66" y="78" width="26" height="8" rx="4" fill="url(#cursorGrad)" filter="url(#neonGlow)" />
</svg>